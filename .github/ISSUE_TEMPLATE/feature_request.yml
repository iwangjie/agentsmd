name: Feature request
description: Suggest a change in how the app works
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do that the app makes hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: A rough shape is enough; we can work out the details together.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Two things the design will not trade away: the source file is never
        rewritten, and a model is never swapped in silently when a request
        fails.
