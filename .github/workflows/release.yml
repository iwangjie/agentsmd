name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            arch: arm64
          - platform: darwin-amd64
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          bun run build
          ls -R build

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp build/${{ matrix.platform }}/*.dmg out/ 2>/dev/null || true
          if [ -d build/${{ matrix.platform }}/AgentsMD.app ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              build/${{ matrix.platform }}/AgentsMD.app \
              out/AgentsMD-${{ steps.version.outputs.value }}-${{ matrix.platform }}.zip
          fi
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
