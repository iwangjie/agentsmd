name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: |
          bun run build
          ls -R build

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp build/darwin-arm64/*.dmg out/ 2>/dev/null || true
          if [ -d build/darwin-arm64/AgentsMD.app ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              build/darwin-arm64/AgentsMD.app \
              "out/AgentsMD-${{ steps.version.outputs.value }}-darwin-arm64.zip"
          fi
          ls -lh out

      - uses: actions/upload-artifact@v7
        with:
          name: darwin-arm64
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
