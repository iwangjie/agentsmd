name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet Go
        run: go vet ./...

      - name: Test Go
        run: go test ./internal/... -race -coverprofile=coverage.out

      - name: Typecheck and build frontend
        run: bun run build:web

      - name: Verify generated bindings are current
        run: |
          bun run generate
          if ! git diff --quiet -- src/mygo.ts; then
            echo "src/mygo.ts is stale; run 'bun run generate' and commit the result."
            git diff -- src/mygo.ts
            exit 1
          fi

      - name: Build the app
        run: bun run build
